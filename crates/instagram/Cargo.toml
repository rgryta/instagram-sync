# The Instagram half of the ingester: the page, the cookie jar, the read-only GraphQL
# queries over plain HTTPS, and the live socket on Meta's gateway, with no browser.
#
# Nothing in `instagram-core` or `instagram-mcp-server` may depend on this crate, and
# neither may the root package that carries the `instagram-mcp` binary, so the MCP
# process cannot hold an Instagram session cookie even by accident. It must not depend
# on `sqlx` either: a fetch that could write would let a payload decide what is stored.
#
# AGPL: the request shapes follow mautrix-meta's `instameow` (AGPL-3.0-or-later).
[package]
name = "instagram-client"
description = "Instagram's DM GraphQL surface over a cookie session, read-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
publish.workspace = true

[[bin]]
name = "instagram-connect-check"
path = "src/bin/instagram-connect-check.rs"

[[bin]]
name = "instagram-live-check"
path = "src/bin/instagram-live-check.rs"

[dependencies]
base64 = "0.23.1"
chrono.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# The live socket's `LSResponse`, decoded with structs written from mautrix's .proto.
prost = "0.14.6"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true

[dev-dependencies]
hex = "0.4.3"
