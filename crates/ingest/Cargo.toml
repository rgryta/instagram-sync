# The ingester: Instagram's GraphQL answers to archive rows, and the `instagram-ingest`
# process that polls and backfills with them.
#
# AGPL: it links `instagram-client`, which is AGPL-3.0-or-later.
[package]
name = "instagram-ingest"
description = "The Instagram DM ingester: poll, backfill, and payloads to archive rows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
publish.workspace = true

[[bin]]
name = "instagram-ingest"
path = "src/bin/instagram-ingest.rs"

[dependencies]
chrono.workspace = true
instagram-client = { path = "../instagram" }
instagram-core.workspace = true
rand = "0.10.3"
# The transcription worker: the audio from the CDN, the words from whisper.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "multipart"] }
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
# Paused time: the token bucket's waits are asserted without sleeping for real.
tokio = { workspace = true, features = ["time", "test-util"] }
