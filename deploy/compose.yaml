services:
  instagram-mcp:
    labels:
      # No Traefik route. The server has no authentication of its own; network
      # isolation inside homelab-network is the whole of its access control.
      # MCPHub reaches it at http://instagram-mcp:8000/mcp.
      - traefik.enable=false
      - wud.watch=true
      - wud.watch.digest=true
      - autoheal=true
    image: ghcr.io/rgryta/instagram-sync:latest
    container_name: instagram-mcp
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No `env_file` and no credential: this container reads the archive and nothing else.
    environment:
      INSTAGRAM_MCP_DSN: postgresql://instagram_mcp:${INSTAGRAM_MCP_DB_PASSWORD}@homelab-postgres:5432/instagram
      INSTAGRAM_MCP_HOST: 0.0.0.0
      INSTAGRAM_MCP_PORT: "8000"
      INSTAGRAM_MCP_ALLOWED_HOSTS: instagram-mcp
      TZ: Europe/Warsaw
    command:
      - /usr/local/bin/instagram-mcp
    networks:
      homelab-network:
        ipv4_address: 172.20.0.86
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/instagram-mcp
        - --health-check
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Instagram without a browser: the inbox page and four persisted read queries over
  # HTTPS, and the gateway socket that says when to read. The only container with the
  # session (the cookie jar, in the `ingest_session` table) and the only one with DDL
  # rights: it applies the migrations at boot. Exposes no port.
  #
  # No healthcheck: the poll loop sleeps ~15 minutes between full passes by design. The
  # MCP status tool shows both loops' last run.
  instagram-ingest:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.watch.digest=true
    image: ghcr.io/rgryta/instagram-sync:latest
    container_name: instagram-ingest
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      INSTAGRAM_DSN: postgresql://instagram_ingest:${INSTAGRAM_INGEST_DB_PASSWORD}@homelab-postgres:5432/instagram
      INSTAGRAM_ACCOUNT: ${INSTAGRAM_ACCOUNT}
      TZ: Europe/Warsaw
      # First start only: a cookie export from a signed-in browser (Playwright's
      # `context.cookies()` JSON), mounted from /mnt/quick/apps/volumes/instagram-sync/seed.
      # Ignored once the database holds a session; remove the file, this line and the
      # volume once the log says it was seeded.
      # INSTAGRAM_COOKIES_FROM: /seed/cookies.json
    # volumes:
    #   - /mnt/quick/apps/volumes/instagram-sync/seed:/seed:ro
    command:
      - /usr/local/bin/instagram-ingest
    networks:
      homelab-network:
        ipv4_address: 172.20.0.87
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

networks:
  homelab-network:
    external: true
